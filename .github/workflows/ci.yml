name: CI

# Armada's workflow, copied on 2026-10-29 and cut to what Drakar has. Every place it
# behaves differently says `DIVERGES from armada:` and why; the rest is armada's, comments
# included where they still hold.

on:
  push:
    branches: [main]
    # A release is a signed `app-v<version>` tag. Nothing else ships. The glob
    # also matches a pre-release such as app-v1.3.0-beta.1, which release-app
    # refuses in "Resolve version from tag".
    tags: ["app-v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job asks for more, and only release-app does, beside its own
# `permissions:`. Without this every job's GITHUB_TOKEN gets the repository's
# default, which can be write, including in the jobs that run a pull request's code.
permissions:
  contents: read

# Third-party actions are pinned to a commit, with the tag it was resolved from
# beside it: a tag is a pointer its owner can move to new code, and these run in
# jobs holding the Cloudflare token or the right to publish a release.
# attest-build-provenance is GitHub's own, and pinned anyway because it holds
# `id-token: write`. actions/checkout and actions/setup-node ride their major tags.
# The SHAs are armada's, verbatim, so a pin moved in one repo reads across to the other.
# To move a pin: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
jobs:
  # The Node half's gates, on ubuntu: the scripts the release path runs, and the
  # licence Worker. Nothing here compiles Swift, so nothing here needs a Mac, and
  # both deploys wait on this rather than on the macOS queue.
  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # `24`, not `lts/*`: `lts/*` moves to the next major every October, which
      # would put CI on a runtime no release has been built with.
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        run: pnpm install --frozen-lockfile
      # Root-only commands: one oxlint and one oxfmt config cover both halves.
      # Both leave apps/apple, docs/ and generated files alone (.oxlintrc.json,
      # .oxfmtrc.json); the Swift half has its own gate in `app`.
      - name: Lint and format 🔍
        run: |
          pnpm lint
          pnpm format:check
      # The CHANGELOG parse the appcast, the release body and What's New share, the
      # Sparkle signature check `make appcast` runs, the licence minter, and the
      # revocation list's generator.
      - name: Script tests 🧪
        run: pnpm test:scripts
      # The licence Worker's suite runs in the Workers runtime (miniflare) against a
      # local D1, and includes the check that it mints byte-identical keys to
      # scripts/lib/license.mjs — the half of the money loop nothing else tests.
      #
      # The generated Env types are checked first, against .dev.vars.example, which
      # is what worker-configuration.d.ts was generated from, so no real .dev.vars is
      # needed. A binding added to wrangler.jsonc without regenerating would
      # otherwise typecheck against the Env it no longer matches.
      #
      # The `--` is load-bearing: without it pnpm 11 takes `--env-file` as its own
      # and hands it to node, which exits 9 on "node: .dev.vars.example: not found".
      - name: API tests 🧪
        run: |
          pnpm -C apps/api exec -- wrangler types --check --env-file=.dev.vars.example
          pnpm -C apps/api typecheck
          pnpm -C apps/api test

  # The site is built on every push so a broken page fails here, on the pull
  # request, rather than in the deploy job after it has merged.
  #
  # DIVERGES from armada: no `lfs: true`, because this repository has no LFS
  # objects (the site's images are plain files), and no feedback-form check,
  # because the skeleton site has no form. `make site-build` is the plain build.
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        run: pnpm install --frozen-lockfile
      # `astro check` first, through the root `check` every sibling's website job
      # calls, because Vite strips types without checking them: a type error in a
      # page or in config.ts builds, and deploys.
      - name: Check 🔍
        run: pnpm check
      - name: Build 📦
        run: make site-build

  # The gate `scripts/generate-revocations.mjs` claims in its header: `--check`
  # compares the committed Revocations.swift with D1.
  #
  # What it prevents: a licence is refunded, `revoked_at` is set in D1, the
  # manual `make revocations` is forgotten, and the next notarized release
  # bakes in a stale list, leaving the refunded key working. Build-time
  # revocation is the design's only enforcement point, so nothing else
  # catches it.
  #
  # Its own job, on ubuntu, and the only verify job with `environment:`.
  # CLOUDFLARE_API_TOKEN is a secret of the `production` environment, not of
  # the repository, so a job that names no environment reads it as empty and
  # the check would skip on every run, tags included. Not on pull requests:
  # this compares the committed file with D1, which a pull request's code
  # cannot change, and leaving them out keeps the token away from a branch's
  # dependencies. The token is on the step, not the job, so `pnpm install`
  # runs without it.
  #
  # The script skips itself, passing, when there is no token. On a release tag
  # it fails instead, since release-app needs this job.
  revocations:
    name: Revocations
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        run: pnpm install --frozen-lockfile
      - name: Revocations drift 🔍
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/generate-revocations.mjs --check

  # DIVERGES from armada: no icon drift check (Drakar has no `icon-check` target:
  # `make -C apps/apple icon` rebuilds Drakar.icon and the result is committed), no
  # screenshot pipeline, no `unit` target (Drakar's pure code is in the DrakarKit
  # package, which `test` runs), and no `test-app`: the hosted suite launches the
  # app, which a check must never do.
  app:
    name: App
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 because CURRENT_PROJECT_VERSION is the commit count. A
      # shallow clone would silently count only what it fetched and produce a
      # build number that moves on every re-run.
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        run: pnpm install --frozen-lockfile

      # The fast gates first: none of them compiles anything, so there is no
      # reason to spend an Xcode build discovering a misformatted file. The Node
      # half's lint, format and script tests are in `node`, on ubuntu.
      - name: Format (swift) 🔍
        run: make -C apps/apple format-swift-check
      # A stale Changelog.swift would ship What's New notes that describe a
      # different build than the one they are inside.
      - name: Changelog drift 🔍
        run: make changelog-check
      # The claim that nothing Drakar reads leaves the Mac beyond the opt-in update
      # check, asserted against the sources. SECURITY.md says CI runs it; this and
      # release-app's `make audit-release` are what make that true.
      #
      # DIVERGES from armada: among the fast gates, not after the build, and with no
      # XCARGS. Drakar's `make audit` reads the sources alone and builds nothing; the
      # bundle half is `make audit-release`, on the signed artifact in release-app.
      - name: Audit the network claim 🔍
        run: make audit

      # The cross-language check, and the one whose failure costs money. JavaScript
      # mints the keys and Swift accepts them, so a disagreement lives between the
      # two, where neither side's own tests can see it. This compiles the real
      # License.swift and runs keys signed with the real signing key through it.
      #
      # Bastion's guard, copied: it needs LICENSE_SIGNING_KEY, which a fork never
      # has, so it skips loudly rather than failing there, and `if:` cannot read
      # `secrets`, so the guard is in the shell. A repository secret if it is set,
      # never an org-wide one: it is the one key that cannot be rotated without
      # refusing every licence ever sold. Until it is set, this skips.
      - name: Licence round trip 🔍
        env:
          LICENSE_SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
        run: |
          if [ -z "$LICENSE_SIGNING_KEY" ]; then
            echo "::warning::no LICENSE_SIGNING_KEY secret; skipping the licence round trip"
            exit 0
          fi
          make license-check

      # The pinned Sparkle framework, checked against its digest. The build links it.
      - name: Sparkle 📦
        run: make -C apps/apple sparkle

      # No signing here: there is no certificate on the runner for this job, and it
      # answers "does it still compile", not "is it shippable". release-app below
      # is the job that signs.
      #
      # DIVERGES from armada, whose step is `make build`: Drakar's Debug `build`
      # takes no XCARGS, so signing could not be switched off through it. The
      # Release build does take them, and is the configuration that ships.
      - name: Build 🏗️
        run: make -C apps/apple build-release XCARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"

      # DrakarKit's suite: the stream-json codec against captured fixtures, process
      # supervision, the session index, the IDE bridge's protocol. Offline, no app.
      # `-C apps/apple`, because the root's `make test` also runs the script and
      # Worker suites, which `node` has already run.
      - name: Tests (swift) 🧪
        run: make -C apps/apple test

  # The app ships as a Developer ID signed, notarized zip attached to a GitHub
  # release, with a Sparkle appcast beside it — never from the website, whose
  # /download, /checksum and /appcast.xml are 302s to
  # releases/latest/download/<asset>. Drakar is not an App Store app.
  #
  # Armada's release-app job, step for step, which is bastion's with cupertino's
  # form of the one place bastion is weaker: the App Store Connect key reaches the
  # script through `env:`, never pasted into the `run:` text, where a secret becomes
  # part of the script GitHub writes to disk and echoes on a syntax error.
  release-app:
    name: Release Drakar.app
    runs-on: macos-latest
    # `node` as well as `app`: the lint, script and licence Worker gates are in
    # `node` and still gate a release. And `revocations`, so a stale list of
    # refunded keys never ships.
    needs: [node, app, revocations]
    if: startsWith(github.ref, 'refs/tags/app-v')
    # The signing secrets (Developer ID, App Store Connect key, Sparkle key)
    # live in the `release` environment, whose deployment policy admits only
    # `app-v*` tags: a workflow edited on a branch or a pull request cannot
    # read them, whatever it asks for. AC_ISSUER_ID is a team identifier rather
    # than a credential and stays a repository secret.
    environment: release
    permissions:
      contents: write
      # attest-build-provenance signs the artifact's provenance, so the zip a user
      # downloads can be traced to the workflow run and commit that built it.
      id-token: write
      attestations: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Node only for scripts/changelog-notes.mjs and scripts/verify-update-signature.mjs,
      # neither of which has a dependency.
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      # The tag is authoritative about what ships, and the copies of the version
      # are separate edits in the release commit. Refuse here, where the fix is a
      # commit and a re-tag, rather than after a notarized zip is public and an
      # appcast names a release that does not match the app inside it.
      - name: Resolve version from tag 🔍
        id: version
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          # A plain release only. The release below is published with
          # make_latest, and the site's /appcast.xml is a 302 to
          # releases/latest, so an app-v1.3.0-beta.1 tag would offer the beta to
          # every installed copy through Sparkle. There is no beta channel;
          # refuse here, before anything is signed.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${GITHUB_REF_NAME} is not a plain x.y.z release; a pre-release would reach every user through the appcast"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          fail=0
          # Both build configurations, because they are edited by hand.
          # DIVERGES from armada, which counts 2: Drakar's session host,
          # DrakarHost, is a target of its own with the version in both of its
          # configurations too, so the count is 4 (the app and the host, Debug
          # and Release). The tests target keeps 1.0 and is not counted.
          marketing=$(grep -c "MARKETING_VERSION = $version;" apps/apple/Drakar.xcodeproj/project.pbxproj || true)
          if [ "$marketing" != "4" ]; then
            echo "::error::project.pbxproj has $marketing of 4 configurations (Drakar and DrakarHost, Debug and Release) at MARKETING_VERSION = $version"
            fail=1
          fi
          # DIVERGES from armada: no apps/website/src/config.ts APP_VERSION check.
          # Drakar's site carries no version number (it links to /download, which
          # is releases/latest), so there is no copy there to disagree.
          #
          # The CHANGELOG is a shipped artifact twice over: `make appcast` puts the
          # tag's section in the Sparkle feed, and the release body below is the
          # same section as markdown. A stale heading ships the previous release's
          # notes to everyone deciding whether to install.
          # The first `## [` heading of any kind. Matching only numbered ones read
          # straight past an `## [Unreleased]` left on top, and passed whenever the
          # tag's own section sat below it.
          first=$(grep -m 1 '^## \[' CHANGELOG.md || true)
          head=$(printf '%s\n' "$first" | sed -n 's/^## \[\([^]]*\)\].*/\1/p')
          if [ "$head" != "$version" ]; then
            echo "::error::the first CHANGELOG section is [$head], not [$version] — is it still [Unreleased]?"
            fail=1
          fi
          # DIVERGES from armada, which has no pending form: Drakar's parser also
          # reads `## [1.0.0] - Unreleased`, a version written down before its
          # tag (cadence's form), and would hand it to the appcast and the release
          # body with no date. The release commit dates it; a tag on the
          # undated heading is refused.
          if printf '%s\n' "$first" | grep -Eiq -- '-[[:space:]]*Unreleased[[:space:]]*$'; then
            echo "::error::the CHANGELOG section [$head] is still pending (- Unreleased); date it in the release commit"
            fail=1
          fi
          if ! grep -q "\`app-v$version\` being the newest" CHANGELOG.md; then
            echo "::error::the CHANGELOG intro line does not name app-v$version as the newest tag"
            fail=1
          fi
          exit $fail

      # macOS 26 is the deployment target and the appcast's minimumSystemVersion,
      # so a runner image without that SDK fails deep inside xcodebuild with
      # nothing pointing at the cause.
      - name: Check the SDK 🔍
        run: |
          xcodebuild -showsdks | grep -E 'macosx2[6-9]' \
            || { echo "::error::no macOS 26+ SDK on this runner image"; exit 1; }

      - name: Import signing certificate 🔑
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on an interactive keychain prompt that a
          # runner can never answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          # Split on purpose: each keychain already on the list is its own argument.
          # (armada's line, which actionlint flags there; the directive is the only change)
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # `make sign` falls back to an Apple Development certificate with only a
          # warning. Right on a developer's Mac, wrong here: it would produce a
          # build that cannot notarize, several minutes later.
          security find-identity -v -p codesigning | grep -q 'Developer ID Application' \
            || { echo "::error::no Developer ID Application identity after import"; exit 1; }

      # `make sign` refuses a bundle that still carries the placeholder Sparkle or
      # licence public key (PLACEHOLDER-SET-IN-PHASE-2), before anything is signed,
      # so a tag whose commit carries one fails here, not later.
      - name: Build, sign and notarize 📦
        env:
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
          AC_KEY_P8_BASE64: ${{ secrets.AC_KEY_P8_BASE64 }}
        run: |
          # Gone when this step ends, on every exit path: nothing after
          # notarization needs it, and the cleanup at the end of the job runs
          # only after third-party code has had its turn.
          trap 'rm -f "$RUNNER_TEMP/ac.p8"' EXIT
          printf '%s' "$AC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/ac.p8"
          export AC_KEY_PATH="$RUNNER_TEMP/ac.p8"
          # CFBundleVersion is the commit count, not github.run_number, so a re-run
          # of the same tag produces the same bytes and the same SHA-256.
          build=$(git rev-list --count HEAD)
          test "$build" -gt 0 2>/dev/null \
            || { echo "::error::could not count commits; is this a shallow clone?"; exit 1; }
          echo "CFBundleVersion=$build (from $(git rev-parse --short HEAD))"
          make build-release \
            XCARGS="MARKETING_VERSION=${{ steps.version.outputs.version }} CURRENT_PROJECT_VERSION=$build"

      # Signing and notarization are done. What follows downloads and runs
      # Sparkle's tools (`make appcast`) and hands the tree to the attestation
      # and release actions, and none of that should run while the Developer ID identity is
      # one `security` call away. Nothing after this needs the keychain: the
      # verification below reads the system's trust, not this keychain, and in
      # CI sign_update signs from SPARKLE_ED_PRIVATE_KEY through --ed-key-file.
      - name: Drop the signing keychain 🔒
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # Every claim the download page makes, checked against the artifact that is
      # about to be uploaded rather than against the tree it was built from.
      - name: Verify the artifact 🔍
        run: |
          app="apps/apple/.build/Build/Products/Release/Drakar.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          # As an offline machine sees it: proves the ticket was stapled, not
          # merely that notarization was accepted.
          spctl -a -vvv -t install "$app"
          # The network claim, against the signed bundle: every Mach-O swept,
          # Sparkle's shipped defaults, no entitlements in any signature, the
          # hardened runtime on every binary. SECURITY.md's "CI runs it on every
          # release" is this line.
          make audit-release

      # Bastion's format, not cupertino's: the website serves /checksum raw, so
      # this file has to be the bare digest rather than "<hash>  Drakar.zip".
      #
      # DIVERGES from armada, which writes it inline here: Drakar's is the root
      # `make checksum` target, so CI and a rehearsal write it the same way, with
      # the same 65-byte assertion.
      - name: Checksum 🔢
        run: make checksum

      # After the checksum, and that ordering is load-bearing: `make notarize`
      # re-creates Drakar.zip once the ticket is stapled, so both must run after
      # it and describe the same bytes.
      #
      # The release notes go into the appcast inline, as its <description>, and
      # never as a sparkle:releaseNotesLink: a link would be a second fetch at
      # update time, and SECURITY.md promises that a check reads one file.
      - name: Sign the update 🔏
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: make appcast

      - name: Attest provenance 🔏
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          # The feed too: it names the bytes Sparkle will install.
          subject-path: |
            apps/apple/.build/Drakar.zip
            apps/apple/.build/appcast.xml

      # The tag's own CHANGELOG section as markdown, from the parse the appcast
      # renders to HTML, so the two are one release described once and neither
      # shows `### Internal`. It exits non-zero on a missing or empty section.
      - name: Release notes 📝
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog-notes.mjs --markdown "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      # The asset names carry no version on purpose: that is what makes
      # /releases/latest/download/<asset> a permanent URL, which the website's
      # redirects point at. The version lives in the tag.
      - name: Release 🚀
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Drakar ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
          files: |
            apps/apple/.build/Drakar.zip
            apps/apple/.build/Drakar.zip.sha256
            apps/apple/.build/appcast.xml

      # A backstop. The keychain and ac.p8 are already gone by the steps that
      # drop them; this catches a run cancelled between them.
      - name: Clean up secrets 🧹
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ac.p8" "$RUNNER_TEMP/cert.p12"

  # api.drakar.mgcrea.io, on every push to main. `make api-deploy` rather than the
  # pnpm line it wraps, so this and a laptop deploy cannot drift: the recipe refuses
  # on unapplied migrations and curls /health itself.
  #
  # `needs:` names ubuntu jobs only, never `app`, so the Worker never waits behind
  # the macOS queue, and a Swift compile error it has no part in never holds it back.
  deploy-api:
    name: Deploy api
    runs-on: ubuntu-latest
    needs: [node]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      # The token is checked in the shell, not in `if:`: the secrets context is not
      # available to a condition, and referencing it there fails the whole workflow
      # at startup. A fork or a repo without the environment skips loudly.
      - name: Token present? 🔑
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          # An annotation, not a plain line: every step below is gated on this
          # output, so without a warning a rotated or renamed secret leaves a
          # green "Deploy" on every push to main while production stays frozen,
          # and the health curls that would notice are skipped by the same
          # condition.
          else echo "::warning::No CLOUDFLARE_API_TOKEN secret; nothing was deployed."; fi
      - name: Checkout 🛎️
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup node 🔧
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy 🚀
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make api-deploy

  # drakar.mgcrea.io, on every push to main. The release itself never needs this:
  # /download, /checksum and /appcast.xml are 302s to releases/latest/download, so a
  # tag publishes without a site deploy.
  #
  # After deploy-api, for the root `deploy` target's reason: the Worker the /buy
  # flow lands on has to be live first, so a failed API deploy holds the site back.
  # A skipped one does not. `needs` alone would skip this job whenever deploy-api
  # was skipped, with nothing in the run saying why, so the condition names what
  # it waits for. A missing Cloudflare token is not a skip: deploy-api warns and
  # succeeds, and this job then warns on its own.
  #
  # Ubuntu jobs only, as in deploy-api: `node` for lint and the Worker suite,
  # `website` for the site build, never the macOS `app`.
  deploy-website:
    name: Deploy website
    runs-on: ubuntu-latest
    needs: [node, website, deploy-api]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.node.result == 'success' && needs.website.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') }}
    environment: production
    steps:
      - name: Token present? 🔑
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No CLOUDFLARE_API_TOKEN secret; nothing was deployed."; fi
      # DIVERGES from armada: no `lfs: true`; this repository has no LFS objects.
      - name: Checkout 🛎️
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup node 🔧
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # The recipe builds, publishes, and then curls the live URL — `wrangler
      # deploy` exiting 0 is not proof the site moved.
      - name: Deploy 🚀
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make site-deploy
